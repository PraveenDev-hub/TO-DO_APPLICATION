<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>End-to-End Todo App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; }
        input { padding: 8px; width: 70%; }
        button { padding: 8px 12px; }
        ul { padding-left: 0; list-style: none; }
        li { display: flex; justify-content: space-between; background: #f4f4f4; margin-bottom: 8px; padding: 10px; border-radius: 4px; }
        .delete-btn { background: #ff4d4d; color: white; border: none; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>My Todo App</h2>
    <div>
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()">Add</button>
    </div>
    <ul id="todoList"></ul>

    <script>
        async function fetchTodos() {
            const res = await fetch('/api/todos');
            const todos = await res.json();
            const list = document.getElementById('todoList');
            list.innerHTML = '';
            todos.forEach(t => {
                list.innerHTML += `<li>${t.task} <button class="delete-btn" onclick="deleteTodo(${t.id})">Delete</button></li>`;
            });
        }

        async function addTask() {
            const input = document.getElementById('taskInput');
            if (!input.value.trim()) return;
            await fetch('/api/todos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ task: input.value })
            });
            input.value = '';
            fetchTodos();
        }

        async function deleteTodo(id) {
            await fetch(`/api/todos/${id}`, { method: 'DELETE' });
            fetchTodos();
        }

        fetchTodos();
    </script>
</body>
</html>
